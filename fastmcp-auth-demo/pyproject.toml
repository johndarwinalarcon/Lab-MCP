[project]
name = "fastmcp-auth-demo"
version = "0.1.0"
description = "FastMCP authentication and Frankfurter exchange-rate demo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.28.0",
    "PyJWT>=2.10.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.1",
    "truststore>=0.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
fastmcp-auth-server = "app.mcp_server.server:main"
fastmcp-auth-client = "app.client.mcp_client:main"

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
